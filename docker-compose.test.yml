# Test overrides — only what differs from base (docker-compose.yml)
# Verify merged result: icbops testing docker
#
# Every checkout runs this file as its own compose project, which `icbops`
# names `icb-test-<checkout directory>`. Compose scopes the networks and
# volumes to the project, and each container name starts with it. Nothing is
# published to the host, so any number of these run side by side.
#
# The e2e browser runs inside the vue container, which is where `icbops test
# e2e` starts it. A browser on the host shares the host's network namespace,
# and every container that starts or stops anywhere on the machine aborts its
# in-flight requests with ERR_NETWORK_CHANGED.
#
# `on-failure:3` stops a service after three failed starts, so a removed
# checkout or a corrupt volume cannot restart-loop. Docker never restarts
# these when the daemon starts, and `icbops testing start` starts them.
#
# Every health check probes each second during its start period, so a service
# reads healthy within a second of being ready. Its interval, which governs
# afterwards, is what a service that is already up is checked at.

# Each project builds its own image, so a stack's venv comes from its own
# checkout's lockfile whatever another checkout last built.
x-app-build: &app-build
  image: ichrisbirch:${COMPOSE_PROJECT_NAME}
  build:
    context: .
    target: testing

services:
  # Traefik reads its routers and services from files alone. A Docker provider
  # watches the whole daemon, so it would merge every checkout's `api` into one
  # load balancer. Service names resolve only inside this project's networks.
  #
  # It listens on 8443 so the URLs are the ones the app, the CORS origins and
  # the CSP already name. The aliases are for Node's requests in the e2e setup;
  # Chromium sends every *.localhost name to loopback without asking DNS, so
  # playwright.config.ts maps those names to `traefik` itself.
  # Note: v3.6+ required for Docker 29+ API compatibility (auto-negotiation)
  traefik:
    container_name: ${COMPOSE_PROJECT_NAME}-traefik
    command:
      - "--ping=true"
      - "--log.level=DEBUG"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.websecure.address=:8443"
      - "--entrypoints.websecure.http.tls.domains[0].main=*.test.localhost"
    ports: !override []
    volumes: !override
      - ./deploy-containers/traefik/dynamic/test:/etc/traefik/dynamic:ro
      - ./deploy-containers/traefik/certs:/etc/ssl/certs:ro
    networks:
      proxy:
        aliases:
          - api.test.localhost
          - app.test.localhost
      default: {}
    restart: on-failure:3
    healthcheck:
      start_period: 30s
      start_interval: 1s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "traefik-test"

  # Test database — tmpfs for speed, durability disabled
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    environment: !override
      - POSTGRES_DB=ichrisbirch
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/tmp/postgres
    tmpfs:
      - /tmp/postgres
    volumes: !override []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ichrisbirch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c max_connections=100
      -c shared_buffers=128MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c log_destination=stderr
      -c logging_collector=off
    restart: on-failure:3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "postgres-test"

  # Test Redis — no persistence and no password. secrets.test.enc.env leaves
  # REDIS_PASSWORD empty to match: redis-py retries a refused AUTH with
  # backoff, so a password here turns every Redis call into seconds of waiting.
  redis:
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    command: >
      redis-server
      --save ""
      --appendonly no
      --loglevel warning
    environment: !override []
    volumes: !override []
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "redis-test"

  api:
    <<: *app-build
    container_name: ${COMPOSE_PROJECT_NAME}-api
    command: >
      uvicorn ichrisbirch.wsgi_api:api
      --host 0.0.0.0
      --port 8000
      --log-level debug
      --no-access-log
    environment: !override
      - ENVIRONMENT=testing
      - FASTAPI_DEBUG=False
      - FASTAPI_TESTING=True
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - LOG_COLORS=${LOG_COLORS:-true}
    volumes: !override
      - .:/app
      - /app/.venv
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      start_interval: 1s
      retries: 5
    labels: !override []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "api-test"

  scheduler:
    <<: *app-build
    container_name: ${COMPOSE_PROJECT_NAME}-scheduler
    command: python -m ichrisbirch.wsgi_scheduler
    environment: !override
      - ENVIRONMENT=testing
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - LOG_COLORS=${LOG_COLORS:-true}
    volumes: !override
      - .:/app
      - /app/.venv
    restart: on-failure:3
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "scheduler-test"

  # Vue dev server — completely replaces prod Caddy build. Its image is
  # Playwright's, which carries Node and the browsers, so the e2e suite runs
  # here against this stack. The tag matches @playwright/test in
  # frontend/package-lock.json, and tests/playwright-image-version.bats holds
  # them level. A new checkout installs node_modules from nothing, so the
  # start period allows for a full `npm install`.
  vue:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    build: !reset null
    container_name: ${COMPOSE_PROJECT_NAME}-vue
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment: !override
      - VITE_API_URL=https://api.test.localhost:8443
      - ICB_TEST_STACK=true
      - NPM_CONFIG_UPDATE_NOTIFIER=false
    restart: on-failure:3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      start_interval: 1s
      retries: 3
    # `/.test-reports` is `../.test-reports` from /app, where the Playwright
    # config writes its JSON report, so the report lands in the checkout.
    volumes: !override
      - ./frontend:/app
      - vue_test_node_modules:/app/node_modules
      - ./.test-reports:/.test-reports
    labels: !override []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "vue-test"

# Test volumes — override base names to isolate from prod/dev and from every
# other checkout's stack.
# .venv is an anonymous volume on api/scheduler (matches dev pattern) —
# Docker seeds it from the image layer on every new container, so rebuilding
# the image always produces a fresh venv. A named volume would persist stale
# contents across rebuilds and break runtime package resolution.
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data
    driver: local
  redis_data:
    name: ${COMPOSE_PROJECT_NAME}-redis-data
    driver: local
  vue_test_node_modules:
    name: ${COMPOSE_PROJECT_NAME}-vue-node-modules
    driver: local

# No `name:`, so compose prefixes each with the project.
networks:
  proxy:
    external: false
    driver: bridge
  default:
    driver: bridge
