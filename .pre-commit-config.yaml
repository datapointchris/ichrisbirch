# forge-toolchain: 19
fail_fast: true
default_stages: [pre-commit]
repos:

# > custom:before:conventional-commits - Stats capture (must run first)
  - repo: local
    hooks:
      - id: devstats-capture
        name: devstats capture
        stages: [pre-commit]
        language: system
        entry: uv run python -m stats.pre_commit_capture
        pass_filenames: false
        always_run: true

# generated:conventional-commits - Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

# generated:go-release-major - Refuse a commit message that would cut a major release
  - repo: local
    hooks:
      - id: no-major-release-marker
        name: Refuse a commit that would cut a major
        # A major on a Go module here is an outage, not a version: no module path
        # carries a /vN suffix, so `go install …@latest` cannot see the new tag
        # and silently resolves the highest v1 instead. The analyzer matches this
        # marker unanchored against the raw message and ORs it with the
        # configured rules, so .semrelrc cannot stop it and it majors even a
        # `fix:`. Prose could not stop it either — three repos crossed in one
        # evening with the ban already written down.
        #
        # $HOME is not usable here and no script is either: this has to run on
        # any clone, so the whole check is inline. pre-commit execs entry without
        # a shell, hence `bash -c … --`, after which $1 is the message file.
        #
        # Comments are stripped first. git discards them, so a commit template
        # that names the marker must not fail a commit that does not use it.
        entry: bash -c 'grep -vE "^#" "$1" | grep -qiE "breaking[ -]changes?" && { echo "This message would cut a major release, which strands every installed binary."; echo "Use chore(release-major) to major on purpose, or say it another way."; exit 1; }; exit 0' --
        language: system
        stages: [commit-msg]

# generated:file-checks - File format and basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # --unsafe parses instead of safe_load'ing. Every mkdocs-material repo
      # carries `!!python/name:material.extensions.emoji.twemoji`, which
      # safe_load can never construct — five repos fail this hook without it.
      # The alternative is excluding mkdocs.yml, which checks strictly less.
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      # tsconfig.json is JSONC — TypeScript documents comments in it, and the
      # generated one ships with them, so a strict JSON parser is the wrong
      # tool rather than the file being wrong. check-json5 below still parses
      # it, so nothing is unchecked.
      - id: check-json
        exclude: '(^|/)tsconfig(\..*)?\.json$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
    hooks:
      - id: check-json5

# > custom:after:file-checks - Compose files parse with the real parser
  - repo: local
    hooks:
      - id: docker-compose-validate
        name: validate docker compose files
        description: "Validate compose files using the actual Docker Compose parser"
        entry: bash -c 'docker compose -f docker-compose.yml config --quiet && docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet && docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet'
        language: system
        files: ^docker-compose.*\.yml$
        pass_filenames: false

# generated:markdown - Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix]

# > custom:after:markdown - Jinja templates
  # HTML/Jinja templates
  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-jinja
        args: ["--reformat"]
      - id: djlint

# generated:shell - Shell
  #
  # exclude_types: [zsh] on both tools. Neither supports zsh, and neither says
  # so — shellcheck lints a .zshrc as bash and reports nothing, while shfmt
  # reformats it under bash rules: on dotfiles it rewrote `>&2 }` to `>&2; }`,
  # correct for bash and unnecessary in zsh. Both were silently out of contract,
  # which is worse than either erroring. identify already tags these files zsh,
  # so this is the native exclusion rather than a path regex that would have to
  # enumerate .zshrc, .zprofile, .zlogin and the rest.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        exclude_types: [zsh]

  # shfmt has no pre-commit hooks file of its own, so this is the repo shfmt's
  # README points at. Its `shfmt` id runs the prebuilt upstream binary, which
  # keeps the hook off a Go toolchain; `shfmt-src` is the one that needs Go.
  #
  # No formatting args on purpose. A parser or printer flag does not merge with
  # .editorconfig — it discards the file wholesale, so adding `--indent 2` here
  # would silently drop switch_case_indent and binary_next_line along with it.
  # Output flags (--write, --diff) are safe. .editorconfig is the style.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        exclude_types: [zsh]

  # bats ships no hook repo of its own, so this one is local.
  #
  # The guard distinguishes "this repo has no tests" from "this repo has tests
  # and bats is missing". Only the first is allowed to pass: a bare `bats
  # tests/` under language: system would be the second hook in this portfolio to
  # report success because its tool was absent, which is how font accumulated
  # seven shellcheck findings behind a green hook.
  - repo: local
    hooks:
      - id: bats
        name: bats
        entry: bash -c 'compgen -G "tests/*.bats" > /dev/null || exit 0; exec bats tests/'
        language: system
        pass_filenames: false

# generated:codespell - Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      # Lock files are generated and mostly integrity hashes, so a base64
      # fragment reads as a typo — two of timeline's package-lock.json hashes
      # each contained a two-letter sequence codespell corrects. Nobody writes
      # prose in them and nobody would fix a hit, since the next install would
      # put it back.
      - id: codespell
        # The second alternation is sops output. Ciphertext is base64, so it
        # produces the same false hits a lock file's hashes do, and the plain
        # name covers homelab's group_data/secrets.yaml as well as the
        # *.enc.env convention.
        #
        # `go.mod` sits beside `go.sum` for the same reason one step earlier: it
        # is mostly module paths, and a path is a third party's name rather than
        # prose anyone here can correct. Adding sqlc to fleet pulled in a
        # `sqlc-dev` module whose name codespell wants hyphenated, and no edit
        # could fix it — the next `go mod tidy` writes it straight back. Naming
        # it here would trip this hook on this very file, which is how the rule
        # was found.
        exclude: '(^|/)(.*-lock\.json|.*\.lock|uv\.lock|package-lock\.json|go\.sum|go\.mod|secrets?[^/]*\.(ya?ml|env|json)|.*\.enc\.[^/]+)$'

# generated:refcheck - Reference checking
  #
  # `--moves` is what earns this a place on every commit, and running without
  # it would be close to running nothing. Measured across all 49 active repos:
  # the whole-tree half — every `source` and `bash` target — found zero real
  # errors, because the portfolio is already clean. The moves half asks the
  # question a rename actually leaves behind, for each one in the changeset,
  # and that is where the findings were: three live `uv run` call sites in
  # ichrisbirch's ops tool naming a log viewer that had moved months earlier,
  # and a documented build command in shadows pointing into a directory the
  # repo no longer has.
  #
  # Deliberately no path spelled out above. A comment naming a real old path
  # is itself a hit for it, in every repo this block is deployed to.
  #
  # Generic rather than shell-gated, because a pattern is language-agnostic:
  # the hits landed in Go, Vue and Python repos as readily as in dotfiles, in
  # YAML and prose as readily as in scripts. The compiled languages catch their
  # own broken *imports*, which is a different question from what a doc, a
  # Dockerfile or a shell wrapper still says.
  #
  # No --strict: one advisory warning across the whole fleet, and a warning is
  # about fragility rather than breakage.
  - repo: https://github.com/datapointchris/refcheck
    rev: v0.6.0
    hooks:
      - id: refcheck
        args: [--moves]

# generated:python-format - Python: dependency lock
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.3
    hooks:
      - id: uv-lock

  # Python: formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-format

# generated:python-lint - Python: linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [--fix]

  # Python: type checking (uses uv for full dependency visibility)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy . --install-types --non-interactive
        language: system
        types: [python]
        pass_filenames: false

# generated:go - Go
  # Every -repo- hook runs in each go.mod it finds, so a repo holding api/ and
  # cli/ needs no hook per module.
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.1
    hooks:
      - id: go-fumpt-repo
        args: [-w]
      - id: go-vet-repo-mod
      - id: go-build-repo-mod
      - id: go-mod-tidy-repo
      - id: go-test-repo-mod
        # A commit gate runs the fast tests; CI runs everything. Without this a
        # repo with DB integration tests has to keep a hook of its own.
        args: [-short]
      - id: golangci-lint-repo-mod

# generated:vue - Vue/Frontend
  # Every hook runs from the component directory, so filenames are never passed:
  # pre-commit hands them out repo-root-relative, which resolves to the wrong
  # place the moment the command has cd'd. files: still gates whether it runs.
  - repo: local
    hooks:
      - id: vue-eslint
        name: eslint (vue)
        entry: bash -c 'cd frontend && npm run lint:fix'
        language: system
        pass_filenames: false
        files: '^frontend/.*\.(vue|js|ts|jsx|tsx)$'

      - id: vue-prettier
        name: prettier (vue)
        entry: bash -c 'cd frontend && npx prettier --write .'
        language: system
        pass_filenames: false
        files: '^frontend/.*\.(vue|js|ts|jsx|tsx|css|scss|json)$'

      - id: vue-typecheck
        name: typecheck (vue)
        # --if-present: a plain-JS Vue app has nothing to typecheck, and that is
        # a true answer rather than a gap. Every other hook here stays strict.
        entry: bash -c 'cd frontend && npm run --if-present typecheck'
        language: system
        pass_filenames: false
        files: '^frontend/.*\.(vue|ts|tsx)$'

# > custom:after:vue - Frontend test runs that capture results for stats
  # Vue/Frontend (only run when frontend/package.json exists)
  - repo: local
    hooks:
      - id: vue-test-results
        name: vue tests (results capture)
        description: "Run Vitest unit tests and capture results for stats"
        entry: bash -c '[ ! -f frontend/package.json ] && exit 0; cd frontend && npm test; rc=$?; cd .. && uv run python -m stats.collect_report vitest; exit $rc'
        language: system
        pass_filenames: false
        files: '^frontend/.*\.(vue|ts|tsx)$'
        stages: [pre-commit]

      - id: vue-e2e-results
        name: vue e2e (results capture)
        description: "Run Playwright E2E tests and capture results for stats"
        entry: bash -c '[ ! -f frontend/package.json ] && exit 0; ./ops/icbops testing ensure && cd frontend && npx playwright test; rc=$?; cd .. && uv run python -m stats.collect_report playwright; exit $rc'
        language: system
        pass_filenames: false
        files: '^frontend/.*\.(vue|ts|tsx)$'
        stages: [pre-commit]

# generated:docker - Docker
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      # DL3018 is DL3008's apk counterpart — the same "pin every package
      # version" rule, for the five alpine-based images here. Ignoring one and
      # enforcing the other only means the Debian images pass and the Alpine
      # ones do not; pinning an apk version also breaks on the next base image
      # bump, which is why DL3008 was ignored to begin with.
      #
      # The exclude is not about rules. hadolint matches on the Dockerfile name,
      # and BuildKit's per-file ignore list is named <dockerfile>.dockerignore —
      # learning has web/Dockerfile.dockerignore — so hadolint tried to parse an
      # ignore list as a Dockerfile and failed on its first glob.
      - id: hadolint-docker
        args: ["--ignore", "DL3008", "--ignore", "DL3018", "--ignore", "DL4006"]
        exclude: '\.dockerignore$'

# generated:github-actions - GitHub Actions
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        args: ["-color", "-shellcheck="]

# generated:terraform - Terraform
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.5
    hooks:
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_fmt
      - id: terraform_docs
        args:
          - --args=--anchor=false
          - --args=--html=false

# generated:sql - SQL
  # Lint only, never fix: sqlfluff's fixer rewrites whole statements, and a
  # hook that reformats migrations under you is one nobody trusts.
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, "postgres", --config, .sqlfluff]

# > custom:after:all - Project validations, then tests and stats collection
  - repo: local
    hooks:
      - id: code-sync
        name: Code Sync
        description: "Synchronize code snippets in documentation using AST parsing"
        entry: uv run python -m mkdocs_plugins.code_sync
        language: python
        pass_filenames: false
        always_run: true
        args: ["docs", "--base-path", "."]

      - id: generate-fixture-diagrams
        name: Generate fixture diagrams
        description: "Generate fixture diagrams when test fixture code changes"
        entry: uv run python -m mkdocs_plugins.diagrams
        language: python
        pass_filenames: false
        files: "(tests/conftest.py|tests/utils/.*|mkdocs_plugins/diagrams/.*\\.py)$"
        always_run: false
        additional_dependencies: ["graphviz", "pyyaml"]

      - id: validate-html
        name: validate html against w3c standards
        stages: [pre-commit]
        language: system
        entry: uv run python scripts/pre_commit_validations/validate_html.py
        types: [html]
        pass_filenames: true
        always_run: false

      - id: validate-markdown-links
        name: validate markdown links
        description: "Check that all markdown links resolve to existing files"
        stages: [pre-commit]
        language: system
        entry: uv run python scripts/pre_commit_validations/validate_markdown_links.py
        types: [markdown]
        pass_filenames: true
        always_run: false

      - id: pytest-results
        name: pytest (results capture)
        description: "Run full pytest suite and capture results for stats"
        stages: [pre-commit]
        language: system
        entry: bash -c 'ENVIRONMENT=testing uv run pytest --tb=short --json-report --json-report-file=/tmp/ichrisbirch-pytest-report.json --cov=ichrisbirch --cov-report=json:.coverage.json 2>&1 | tee /tmp/ichrisbirch-pytest-output.log; rc=${PIPESTATUS[0]}; uv run python -m stats.collect_report pytest; exit $rc'
        types: [python]
        pass_filenames: false
        always_run: false

      - id: devstats-collect
        name: devstats collect
        stages: [post-commit]
        language: system
        entry: uv run python -m stats.post_commit_collect
        pass_filenames: false
        always_run: true
