name: Release CLI

# Tagged `cli/v*` rather than a bare `v*`: the CLI is a nested module with its
# own version, and a bare tag would collide with the app's tag namespace. The
# dotfiles installer resolves the latest release carrying this prefix.
on:
  push:
    tags: ['cli/v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # Archive names must match the {version_num}/{os}/{go_arch} placeholders
      # that dotfiles' packages.yml expands — see install/offline/create-bundle.sh.
      - name: Build and archive
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME#cli/}"
          version_num="${version#v}"
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/datapointchris/ichrisbirch/cli/internal/cli.version=${version}" \
            -o ../dist/icb .
          tar -czf "../dist/icb_${version_num}_${GOOS}_${GOARCH}.tar.gz" -C ../dist icb
          rm ../dist/icb

      - uses: actions/upload-artifact@v4
        with:
          name: icb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum ./*.tar.gz > checksums.txt

      # Not `generate_release_notes` — that lists merged PRs since the last
      # published release, and trunk-based development means there are none to
      # list (cli/v0.1.0 surfaced a stale 2023 PR as its entire changelog).
      - name: Build release notes
        run: |
          previous=$(git tag --list 'cli/v*' --sort=-version:refname | sed -n '2p')
          range="${previous:+${previous}..}${GITHUB_REF_NAME}"
          {
            echo '## Changes'
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" -- cli
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
