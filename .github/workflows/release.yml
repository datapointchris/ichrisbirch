name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: datapointchris

jobs:
  # Called rather than keyed off `workflow_run`, matching release-cli.yml: a
  # call runs against the commit being released, while workflow_run fires on
  # whatever commit finished CI. Publishing an image built from a different
  # tree than the one that passed is the failure that distinction prevents.
  #
  # This is also what covers main. validate.yml emits no `push:` trigger
  # because forge detects that a release workflow calls it, so a push to main
  # is validated here and on no other path.
  validate:
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  build:
    name: Build ${{ matrix.image }}
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ichrisbirch
            dockerfile: Dockerfile
            target: production
            build_args: ""
          - image: ichrisbirch-vue
            dockerfile: frontend/Dockerfile
            target: ""
            build_args: |
              VITE_API_URL=/api
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
