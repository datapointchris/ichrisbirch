# forge-toolchain: 20
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  python:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # > custom:before:python - Testing secrets
      #
      # tests/conftest.py refuses to import without a .env for the testing
      # environment, so pytest here failed at collection. Same two steps
      # validate-project.yml already runs before its own pytest.
      - name: Install SOPS
        uses: mdgreenwald/mozilla-sops-action@v1.6.0
        with:
          version: "3.12.2"

      - name: Decrypt testing secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops decrypt secrets/secrets.test.enc.env > .env

      # uv before the containers, matching validate-project.yml's order and not
      # by preference: `up --build` runs as root over the mounted workspace and
      # leaves .venv root-owned, after which `uv run` dies with EACCES on
      # .venv/CACHEDIR.TAG. Creating the venv first means it is already the
      # runner's.
      #
      # Repeated ahead of the generated block's own setup-uv because a before:
      # section runs before every generated step, including that one. The
      # action is cached, so the second call costs nothing.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      # The suite is integration-only: tests/environment.py aborts the session
      # in CI unless the services are already up, and there is no runner-safe
      # subset to fall back to — the guard fires during setup, before markers
      # could deselect anything. Same stack validate-project.yml stands up.
      - name: Setup Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: "latest"

      - name: Create Docker network
        run: docker network create proxy || true

      - name: Start test services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.ci.yml \
            --project-name icb-test up -d --build --wait --wait-timeout 120 postgres redis
          docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.ci.yml \
            --project-name icb-test up -d --build --wait --wait-timeout 180 api scheduler

      - name: Initialize test database
        run: uv run python -m ichrisbirch.database.initialization --env testing --db-host localhost --db-port 5434

      # generated:python
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      # uvx, not `uv run` — the latter resolves ruff from the repo's own
      # dependencies, and a repo treating ruff as an installed tool rather than a
      # project dependency does not declare it. The version is the one the
      # pre-commit hook pins, so the two cannot disagree about a finding.
      - run: uvx ruff@0.12.5 check .

      - run: uvx ruff@0.12.5 format --check .

      # Declaring mypy as a dependency is the opt-in, and `uv run` is the same
      # invocation the pre-commit hook uses, so a repo passing locally passes
      # here. A [tool.mypy] section is not the opt-in: the standard pyproject
      # template writes one into every repo, infra repos included, and those
      # have nothing importable to check.
      # Tested by import rather than `mypy --version`: `uv run` falls back to
      # PATH, so a machine with mypy installed globally reports it present in a
      # repo that never declared it, and the check would pass locally while
      # behaving differently on a clean runner.
      - name: Type check
        run: |
          if uv run python -c "import mypy" >/dev/null 2>&1; then
            uv run mypy . --install-types --non-interactive
          else
            echo "mypy not a project dependency; skipping"
          fi

      # --with pytest, unlike the mypy step above, because skipping is the wrong
      # answer here: a repo with a real test suite that never declared pytest as
      # a dependency would silently stop being tested. Supplying the runner runs
      # the tests; a suite needing plugins still declares those itself.
      #
      # pytest exits 5 when it collects nothing, which is not a failure for a
      # repo that has no tests yet. Written explicitly rather than as an && chain
      # because the runner uses `bash -e`, where the concise form depends on
      # subtle errexit-exemption rules.
      - name: Test
        run: |
          set +e
          uv run --with pytest pytest
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 5 ]; then exit 0; fi
          exit 1

  go-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:

      - uses: actions/checkout@v7

      # generated:go-cli
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "cli/go.mod"
          cache: true

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      # --allow-parallel-runners because a repo with two Go components runs two
      # of these jobs at once, and golangci-lint takes a lock on its shared
      # cache under $HOME. A hosted runner gives each job its own machine, so
      # they never meet; a self-hosted one is a single box and the second job
      # dies with "parallel golangci-lint is running" and exit 3. The flag makes
      # it wait for the lock instead.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --allow-parallel-runners

      # Two advisories found by hand on 2026-07-26 that this would have caught:
      # GO-2026-5932 (x/crypto/openpgp, unmaintained and unfixed) reached three
      # repos through go-selfupdate, and GO-2026-5856 (crypto/tls) shipped
      # because a stale `go` directive picks the toolchain that compiles the
      # binary, so the stdlib goes stale with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  vue-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:

      - uses: actions/checkout@v7

      # generated:vue-frontend
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          # A glob rather than frontend/package-lock.json, because the two
          # layouts here keep the lock in different places: nomad and meso have
          # one per component in web/, while learning, budget and timeline are
          # npm workspaces with a single lock at the repo root. setup-node
          # fails outright when a named path does not resolve — timeline's
          # client/ has no lock of its own and the job died before npm ci.
          #
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this is not relative to the component.
          cache-dependency-path: "**/package-lock.json"

      # An npm workspace has to install from the root: the lock covers every
      # workspace, and npm ci inside one refuses to run without a lock beside
      # it. Falling back keeps the per-component layout installing in place.
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            cd "$GITHUB_WORKSPACE" && npm ci
          fi

      # Not every frontend defines lint yet; --if-present keeps the rollout
      # from hard-failing on a missing script.
      - run: npm run lint --if-present

      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # generated:terraform
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

      # init without a backend: validate needs the providers resolved, and no
      # PR check should be touching real state.
      - run: terraform init -backend=false

      - run: terraform validate

      # Unconditional: with no .tftest.hcl files this exits 0 reporting
      # "0 passed, 0 failed", so a repo without tests is unaffected.
      - run: terraform test

  shell:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      # generated:shell
      # The runner image ships a shellcheck, but which one drifts with the
      # image, and style-level findings are exactly what moves between
      # versions. Pinning to the same release the pre-commit hook uses is what
      # lets CI run at the hook's severity without a runner bump breaking a
      # release. Version comes from the toolchain manifest.
      #
      # Unpacked into RUNNER_TEMP and called by path rather than dropped in
      # /usr/local/bin, so the step makes no assumption about what the runner
      # image lets us write to.
      #
      # Discovery is by extension *and* shebang: these repos keep their
      # executables in bin/ with no .sh suffix, so an extension glob alone
      # misses most of the tree. The shebang pattern anchors on a slash or
      # space before the interpreter so that zsh does not match on "sh".
      - name: ShellCheck
        run: |
          shellcheck_version="0.10.0"
          mkdir -p "$RUNNER_TEMP/shellcheck"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C "$RUNNER_TEMP/shellcheck" "shellcheck-v${shellcheck_version}/shellcheck"
          shellcheck_bin="$RUNNER_TEMP/shellcheck/shellcheck"
          "$shellcheck_bin" --version

          files=$(git ls-files | while read -r f; do
            case "$f" in
              *.sh|*.bash) echo "$f"; continue ;;
            esac
            if [ -f "$f" ] && head -n1 "$f" | grep -qE '^#!.*[/ ](bash|sh)( |$)'; then
              echo "$f"
            fi
          done)
          if [ -z "$files" ]; then
            echo "no shell files found"
            exit 0
          fi
          echo "$files" | xargs "$shellcheck_bin"

      # Formatting is defined by the repo's .editorconfig, which shfmt reads on
      # its own. Do not add a printer flag here: one flag discards the whole
      # file, so CI would silently grade against a different style than the
      # hook. -d is an output flag, keeps the config, and exits non-zero on any
      # difference. Version comes from the toolchain manifest, like shellcheck.
      #
      # Discovery uses shfmt's own -f over tracked files rather than repeating
      # the shebang scan above, because the two tools disagree about what they
      # can parse and each is the authority on its own set.
      #
      # The zsh filter is not redundant with that. shfmt has no zsh support but
      # -f lists .zsh anyway, so CI formatted a file the hook excludes via
      # exclude_types: [zsh] — dotfiles' prompt.zsh passed every hook and failed
      # here. The two sides have to name the same set or a repo cannot be green
      # in both. shellcheck's scan above needs no such filter: it matches on a
      # bash or sh shebang, which no zsh file carries.
      - name: shfmt
        run: |
          shfmt_version="3.13.1"
          shfmt_bin="$RUNNER_TEMP/shfmt"
          curl -fsSL -o "$shfmt_bin" \
            "https://github.com/mvdan/sh/releases/download/v${shfmt_version}/shfmt_v${shfmt_version}_linux_amd64"
          chmod +x "$shfmt_bin"
          "$shfmt_bin" --version

          files=$(git ls-files | xargs "$shfmt_bin" -f 2>/dev/null \
            | grep -vE '(^|/)(\.?zshrc|\.?zshenv|\.zprofile|\.zlogin|\.zlogout)$|\.zsh$' || true)
          if [ -z "$files" ]; then
            echo "no shell files found"
            exit 0
          fi
          echo "$files" | xargs "$shfmt_bin" -d

      # Tests are bats. All three are cloned at a tag rather than from main:
      # a test harness that moves on its own turns an unrelated upstream change
      # into a failing build, and nothing records which version a green run used.
      #
      # The helper libraries go under ~/.local/lib because that is where the
      # suites `load` them from — the same path they use on a workstation, so a
      # test cannot pass locally and fail here over a lookup path. The suites
      # name that path literally, and `load` resolves nothing, so BATS_LIB_PATH
      # cannot move the libraries anywhere cheaper.
      #
      # Each target is removed before its clone. A self-hosted runner's $HOME
      # survives between jobs, so a bare clone succeeds once on that runner and
      # exits 128 on every job after it. A `[ -d ] ||` guard also fixes that and
      # is worse: the version above is rewritten from the manifest, and a guard
      # would keep serving whichever tag the runner cloned first while CI
      # reported green against the pin nobody is running.
      #
      # Guarded so a shell repo with no suite yet is not a hard failure. The
      # guard covers absence only: if tests exist, bats runs and its exit status
      # stands.
      #
      # Discovery stays flat, and says so when it finds a nested layout it will
      # not run. Recursing was tried: dotfiles keeps every suite in a
      # subdirectory of tests/, so `tests/*.bats` matched nothing and the step
      # reported green having run nothing. But `bats -r` then swept in that
      # repo's integration tier, which wants Docker images and live network and
      # fails on a bare runner.
      #
      # A generic block cannot tell a unit suite from an integration one — only
      # the repo knows which of its tiers is runner-safe. So this runs the flat
      # case, and a nested repo adds a # > custom: step naming its own subset.
      # What it must not do is exit 0 in silence, which is how the layout went
      # unnoticed in the first place.
      - name: bats
        run: |
          bats_version="1.14.0"
          bats_support_version="0.3.0"
          bats_assert_version="2.2.4"

          if [ -z "$(find tests -name '*.bats' -print -quit 2>/dev/null)" ]; then
            echo "no bats tests found"
            exit 0
          fi

          if ! compgen -G "tests/*.bats" > /dev/null; then
            echo "bats suites exist under tests/ but none at its root."
            echo "This step runs tests/*.bats only — a nested layout names its"
            echo "own runner-safe subset in a # > custom: step."
            find tests -name '*.bats' | sed 's/^/  /'
            exit 0
          fi

          git clone --depth 1 --branch "v${bats_version}" \
            https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          sudo "$RUNNER_TEMP/bats/install.sh" /usr/local

          rm -rf "$HOME/.local/lib/bats-support" "$HOME/.local/lib/bats-assert"
          git clone --depth 1 --branch "v${bats_support_version}" \
            https://github.com/bats-core/bats-support.git "$HOME/.local/lib/bats-support"
          git clone --depth 1 --branch "v${bats_assert_version}" \
            https://github.com/bats-core/bats-assert.git "$HOME/.local/lib/bats-assert"

          bats tests/

# > custom:after:all - Stack-level gates
#
# Three jobs no generated block covers. The generated vue job runs eslint and
# `npm run build` (`vue-tsc -b && vite build`), so linting and type checking
# are covered and nothing else here repeats them.
#
# These are jobs rather than steps appended to a component's own job. A
# custom:after:<component> section is read as far as the next `# generated:`
# marker, which sits below the following job's header — so an after: block on
# any component but the last swallows that header and forge emits it twice.

  vue-unit:
    name: Vue unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The literal major, matching the generated vue job. package.json
          # declares a range (">=24"), and pinning the same number in both
          # places keeps a custom job from resolving a different Node than the
          # one the build was checked against.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `vitest run` — the store, composable and view integration tests. The
      # Playwright suite is the job below, because it needs the whole stack
      # rather than a Node runner.
      - run: npm run test:unit

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SOPS
        uses: mdgreenwald/mozilla-sops-action@v1.6.0
        with:
          version: "3.12.2"

      - name: Decrypt testing secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops decrypt secrets/secrets.test.enc.env > .env

      - uses: docker/setup-compose-action@v2
        with:
          version: "latest"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - uses: actions/setup-node@v7
        with:
          # The literal major, matching the generated vue job. package.json
          # declares a range (">=24"), and pinning the same number in both
          # places keeps a custom job from resolving a different Node than the
          # one the build was checked against.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # The E2E suite drives app.test.localhost through Traefik, which is the
      # point of it: the dev-only path to the Vue container skips CORS entirely.
      # Traefik will not start without a cert for that name.
      - name: Generate self-signed TLS certs for Traefik
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout deploy-containers/traefik/certs/test.key \
            -out deploy-containers/traefik/certs/test.crt -days 1 -nodes \
            -subj "/CN=test.localhost" \
            -addext "subjectAltName=DNS:test.localhost,DNS:*.test.localhost,DNS:api.test.localhost,DNS:app.test.localhost"

      - name: Create Docker network
        run: docker network create proxy || true

      - name: Start test stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.ci.yml \
            --project-name icb-test up -d --build --wait --wait-timeout 120 postgres redis
          docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.ci.yml \
            --project-name icb-test up -d --build api vue traefik

      - name: Initialize test database
        run: uv run python -m ichrisbirch.database.initialization --env testing --db-host localhost --db-port 5434

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop test stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.ci.yml \
            --project-name icb-test down -v

  production-build:
    name: Production image build
    runs-on: ubuntu-latest
    # Dev and test bind-mount the source, so neither exercises the COPY in the
    # production stage. A build that only breaks there breaks at deploy, which
    # is the one place there is nothing to fall back to.
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-compose-action@v2
        with:
          version: "latest"

      - name: Build production images
        run: docker compose -f docker-compose.yml build

      - name: Create Docker network
        run: docker network create proxy || true

      - name: Start the production images
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=testpass
          REDIS_PASSWORD=testpass
          DOMAIN=localhost
          EOF

          docker compose -f docker-compose.yml up -d --wait --wait-timeout 120 postgres redis
          docker compose -f docker-compose.yml up -d api scheduler
          sleep 15
          docker compose -f docker-compose.yml ps

          exited=$(docker compose -f docker-compose.yml ps --status exited -q | wc -l)
          if [ "$exited" -gt 0 ]; then
            echo "containers exited after starting from the production images"
            docker compose -f docker-compose.yml logs
            exit 1
          fi

      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml down -v 2>/dev/null || true
