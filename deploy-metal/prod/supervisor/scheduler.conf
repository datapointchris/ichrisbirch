[program:life-scheduler]
directory=/var/www/life/life
command=/var/www/life/.venv/bin/python wsgi_scheduler.py
environment=ENVIRONMENT="production"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/life-scheduler.log
stout_logfile=/var/log/supervisor/life-scheduler.log
