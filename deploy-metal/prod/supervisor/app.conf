[program:life-app]
directory=/var/www/life/life
command=/var/www/life/.venv/bin/gunicorn wsgi_app:app --bind 0.0.0.0:8000 --workers 2
environment=ENVIRONMENT="production"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/life-app.log
stout_logfile=/var/log/supervisor/life-app.log
