[program:life-api]
directory=/var/www/life/life
command=/var/www/life/.venv/bin/gunicorn wsgi_api:api --bind 0.0.0.0:8200 --workers 2 --worker-class uvicorn.workers.UvicornWorker
environment=ENVIRONMENT="production"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/supervisor/life-api.log
stout_logfile=/var/log/supervisor/life-api.log
