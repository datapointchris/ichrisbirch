[program:life-app]
directory=/usr/local/var/www/life/life
command=/usr/local/var/www/life/.venv/bin/gunicorn wsgi_app:app --bind 0.0.0.0:4000 --workers 4
environment=ENVIRONMENT="development"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/usr/local/var/log/supervisor/life-app.log
stout_logfile=/usr/local/var/log/supervisor/life-app.log
