[program:life-api]
directory=/usr/local/var/www/life/life
command=/usr/local/var/www/life/.venv/bin/gunicorn wsgi_api:api --bind 0.0.0.0:4200 --workers 4 --worker-class uvicorn.workers.UvicornWorker
environment=ENVIRONMENT="development"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/usr/local/var/log/supervisor/life-api.log
stout_logfile=/usr/local/var/log/supervisor/life-api.log
