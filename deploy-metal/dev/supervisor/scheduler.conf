[program:life-scheduler]
directory=/usr/local/var/www/life/life
command=/usr/local/var/www/life/.venv/bin/python wsgi_scheduler.py
environment=ENVIRONMENT="development"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stderr_logfile=/usr/local/var/log/supervisor/life-scheduler.log
stout_logfile=/usr/local/var/log/supervisor/life-scheduler.log
