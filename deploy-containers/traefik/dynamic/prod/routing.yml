# Traefik routers for production
#
# All routing rules live here (file provider), not in Docker Compose labels.
# Service definitions (which color to route to) live in services.yml,
# generated by the deploy script. Traefik merges both files automatically.
#
# The PathPrefix list in vue-paths is generated — edit vue-paths.txt and run
# `icbops routing generate` instead of modifying this file directly.

http:
  routers:
    # Same-origin API proxy for Vue frontend
    # Requests to ichrisbirch.com/api/v1/* get Remote-User headers from
    # Authelia and reach FastAPI with the path unchanged. api-v1 and api-proxy
    # are the routers that keep Remote-* headers. The edge sends a bearer
    # request past ForwardAuth, and the API ignores Remote-* beside an
    # Authorization header.
    api-v1:
      rule: "Host(`ichrisbirch.com`) && PathPrefix(`/api/v1`)"
      service: api
      priority: 210
      middlewares:
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web

    # The unversioned routes, with /api stripped, for an API that still serves
    # them at its root. An API serving /api/v1 answers the stripped path 410.
    # The deploy pulls this file before the new color is live, so the color
    # still serving traffic keeps working until the switch, and after a deploy
    # that fails before it.
    api-proxy:
      rule: "Host(`ichrisbirch.com`) && PathPrefix(`/api`)"
      service: api
      priority: 200
      middlewares:
        - strip-api-prefix@file
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web

    # RFC 9728 metadata at the path a CLI configured with `/api` reads. An API
    # serving /api/v1 answers it 410, which tells that CLI to update.
    api-protected-resource:
      rule: "Host(`ichrisbirch.com`) && Path(`/.well-known/oauth-protected-resource/api`)"
      service: api
      priority: 200
      middlewares:
        - strip-authelia-identity-headers@file
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web

    # The API's two unauthenticated paths at the host root: the health check,
    # and the RFC 9728 metadata `icb auth login <url>` reads before it holds a
    # token.
    api-root:
      rule: "Host(`ichrisbirch.com`) && (Path(`/health`) || Path(`/.well-known/oauth-protected-resource`))"
      service: api
      priority: 200
      middlewares:
        - strip-authelia-identity-headers@file
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web

    # Vue SPA — migrated pages served at higher priority
    vue-paths:
      rule: "Host(`ichrisbirch.com`) && (PathPrefix(`/countdowns`) || PathPrefix(`/durations`) || PathPrefix(`/events`) || PathPrefix(`/books`) || PathPrefix(`/coffee/shops`) || PathPrefix(`/coffee/beans`) || PathPrefix(`/autofun`) || PathPrefix(`/autotasks`) || PathPrefix(`/money-wasted`) || PathPrefix(`/articles`) || PathPrefix(`/habits`) || PathPrefix(`/box-packing`) || PathPrefix(`/projects`) || PathPrefix(`/issues`) || PathPrefix(`/recipes`) || PathPrefix(`/shopping`) || PathPrefix(`/strains`) || PathPrefix(`/tasks`) || PathPrefix(`/today`) || PathPrefix(`/profile`) || PathPrefix(`/admin`) || PathPrefix(`/dashboard`) || PathPrefix(`/fonts`) || PathPrefix(`/icons`) || PathPrefix(`/manifest.webmanifest`) || PathPrefix(`/assets`) || Path(`/`))"
      service: vue
      priority: 100
      middlewares:
        - strip-authelia-identity-headers@file
        - cors-prod@file
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web

    # Vue SPA — www subdomain
    vue-paths-www:
      rule: "Host(`www.ichrisbirch.com`) && (PathPrefix(`/countdowns`) || PathPrefix(`/durations`) || PathPrefix(`/events`) || PathPrefix(`/books`) || PathPrefix(`/coffee/shops`) || PathPrefix(`/coffee/beans`) || PathPrefix(`/autofun`) || PathPrefix(`/autotasks`) || PathPrefix(`/money-wasted`) || PathPrefix(`/articles`) || PathPrefix(`/habits`) || PathPrefix(`/box-packing`) || PathPrefix(`/projects`) || PathPrefix(`/issues`) || PathPrefix(`/recipes`) || PathPrefix(`/shopping`) || PathPrefix(`/strains`) || PathPrefix(`/tasks`) || PathPrefix(`/today`) || PathPrefix(`/profile`) || PathPrefix(`/admin`) || PathPrefix(`/dashboard`) || PathPrefix(`/fonts`) || PathPrefix(`/icons`) || PathPrefix(`/manifest.webmanifest`) || PathPrefix(`/assets`) || Path(`/`))"
      service: vue
      priority: 100
      middlewares:
        - strip-authelia-identity-headers@file
        - cors-prod@file
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web
