# Traefik routers for production
#
# All routing rules live here (file provider), not in Docker Compose labels.
# Service definitions (which color to route to) live in services.yml,
# generated by the deploy script. Traefik merges both files automatically.
#
# The PathPrefix list in vue-paths is generated — edit vue-paths.txt and run
# `lifeops routing generate` instead of modifying this file directly.

http:
  routers:
    # Same-origin API proxy for Vue frontend
    # Requests to /api/* on either host get Remote-User headers from Authelia
    # and reach FastAPI with the path unchanged. This is the one router that
    # keeps Remote-* headers. The edge sends a bearer request past ForwardAuth,
    # and the API ignores Remote-* beside an Authorization header.
    api-proxy:
      rule: "(Host(`ichrisbirch.com`) || Host(`life.ichrisbirch.com`)) && PathPrefix(`/api`)"
      service: api
      priority: 200
      middlewares:
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web

    # The API's two unauthenticated paths at the host root: the health check,
    # and the RFC 9728 metadata `life auth login <url>` reads before it holds a
    # token.
    api-root:
      rule: "(Host(`ichrisbirch.com`) || Host(`life.ichrisbirch.com`)) && (Path(`/health`) || Path(`/.well-known/oauth-protected-resource`))"
      service: api
      priority: 200
      middlewares:
        - strip-authelia-identity-headers@file
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web

    # Vue SPA on the root and life hosts, at higher priority than the catch-all. www has its own router below.
    vue-paths:
      rule: "(Host(`ichrisbirch.com`) || Host(`life.ichrisbirch.com`)) && (PathPrefix(`/countdowns`) || PathPrefix(`/durations`) || PathPrefix(`/events`) || PathPrefix(`/books`) || PathPrefix(`/coffee/shops`) || PathPrefix(`/coffee/beans`) || PathPrefix(`/autofun`) || PathPrefix(`/autotasks`) || PathPrefix(`/money-wasted`) || PathPrefix(`/articles`) || PathPrefix(`/habits`) || PathPrefix(`/box-packing`) || PathPrefix(`/recipes`) || PathPrefix(`/shopping`) || PathPrefix(`/strains`) || PathPrefix(`/tasks`) || PathPrefix(`/today`) || PathPrefix(`/profile`) || PathPrefix(`/admin`) || PathPrefix(`/dashboard`) || PathPrefix(`/fonts`) || PathPrefix(`/icons`) || PathPrefix(`/manifest.webmanifest`) || PathPrefix(`/assets`) || Path(`/`))"
      service: vue
      priority: 100
      middlewares:
        - strip-authelia-identity-headers@file
        - cors-prod@file
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web

    # Vue SPA — www subdomain
    vue-paths-www:
      rule: "Host(`www.ichrisbirch.com`) && (PathPrefix(`/countdowns`) || PathPrefix(`/durations`) || PathPrefix(`/events`) || PathPrefix(`/books`) || PathPrefix(`/coffee/shops`) || PathPrefix(`/coffee/beans`) || PathPrefix(`/autofun`) || PathPrefix(`/autotasks`) || PathPrefix(`/money-wasted`) || PathPrefix(`/articles`) || PathPrefix(`/habits`) || PathPrefix(`/box-packing`) || PathPrefix(`/recipes`) || PathPrefix(`/shopping`) || PathPrefix(`/strains`) || PathPrefix(`/tasks`) || PathPrefix(`/today`) || PathPrefix(`/profile`) || PathPrefix(`/admin`) || PathPrefix(`/dashboard`) || PathPrefix(`/fonts`) || PathPrefix(`/icons`) || PathPrefix(`/manifest.webmanifest`) || PathPrefix(`/assets`) || Path(`/`))"
      service: vue
      priority: 100
      middlewares:
        - strip-authelia-identity-headers@file
        - cors-prod@file
        - security-headers-prod@file
        - rate-limit-prod@file
      entrypoints:
        - web

    # The projects page moved to the projects app, so its address forwards there.
    projects-moved:
      rule: "(Host(`ichrisbirch.com`) || Host(`www.ichrisbirch.com`) || Host(`life.ichrisbirch.com`)) && (Path(`/projects`) || PathPrefix(`/projects/`))"
      service: noop@internal
      priority: 100
      middlewares:
        - security-headers-prod@file
        - rate-limit-prod@file
        - redirect-to-projects-app@file
      entrypoints:
        - web
