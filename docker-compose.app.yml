# Application services for blue/green deployment
#
# Deployed as either life-blue or life-green project alongside life-infra.
# Traefik routing is handled by the file provider (routing.yml), not Docker labels.
#
# Usage:
#   DEPLOY_COLOR=blue docker compose --project-name life-blue -f docker-compose.app.yml up -d
#   DEPLOY_COLOR=green docker compose --project-name life-green -f docker-compose.app.yml up -d
#
# Required env vars: DEPLOY_COLOR (blue|green), plus all vars from .env

# Shared image reference for api, scheduler — same image, different
# commands. Built by GHA and pushed to ghcr.io (see .github/workflows/release.yml).
# Blue/green is the docker compose project name; the image tag is color-agnostic.
x-app-image: &app-image
  image: ghcr.io/datapointchris/life:latest

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # FastAPI Backend Service — uses the shared Python image from ghcr.io
  api:
    <<: *app-image
    container_name: life-${DEPLOY_COLOR}-api
    command: uvicorn life.wsgi_api:api --host 0.0.0.0 --port 8000 --workers 4 --no-access-log
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - DEPLOY_COLOR=${DEPLOY_COLOR}
      - FASTAPI_DEBUG=False
      # The address the edge serves this API at. Its RFC 9728 metadata names it,
      # and a CLI logging in refuses that document unless it matches exactly.
      - PUBLIC_URL=https://life.ichrisbirch.com
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_COLORS=${LOG_COLORS:-false}
    ports: []
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 2s
      retries: 3
    working_dir: /app
    logging:
      <<: *logging
      options:
        max-size: "10m"
        max-file: "3"
        tag: "${DEPLOY_COLOR}-api"
    labels:
      - "traefik.enable=false"
    networks:
      - proxy
      - life-infra

  # Vue Frontend Service (Caddy serves built SPA assets)
  vue:
    image: ghcr.io/datapointchris/life-vue:latest
    container_name: life-${DEPLOY_COLOR}-vue
    ports: []
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      start_interval: 2s
      retries: 3
    logging:
      <<: *logging
      options:
        max-size: "10m"
        max-file: "3"
        tag: "${DEPLOY_COLOR}-vue"
    labels:
      - "traefik.enable=false"
    networks:
      - proxy
      - life-infra

  # Scheduler Service (APScheduler background jobs)
  scheduler:
    <<: *app-image
    container_name: life-${DEPLOY_COLOR}-scheduler
    depends_on:
      - api
    command: python -m life.wsgi_scheduler
    env_file: .env
    environment:
      - ENVIRONMENT=production
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_COLORS=${LOG_COLORS:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    healthcheck:
      disable: true
    working_dir: /app
    logging:
      <<: *logging
      options:
        max-size: "10m"
        max-file: "3"
        tag: "${DEPLOY_COLOR}-scheduler"
    networks:
      - life-infra

# Connect to infrastructure networks
networks:
  proxy:
    external: true
  life-infra:
    name: life-infra_default
    external: true
