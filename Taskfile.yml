version: '3'

# Scope: the Go CLI in cli/ only. Everything else — dev/test containers, docker,
# routing, ssl, db, logs — belongs to ops/icbops and is not duplicated here.

vars:
  # Match only the CLI's own tags and strip the prefix, so a local build reports
  # the same shape as a release (v0.2.0-3-gabc1234) instead of the app's tags.
  VERSION:
    sh: git describe --tags --match 'cli/v*' --always --dirty 2>/dev/null | sed 's|^cli/||' || echo dev
  # ~/.local/bin, not $GOBIN: that is where the dotfiles release installer puts
  # icb, and it precedes ~/go/bin on PATH — a $GOBIN install would sit there
  # shadowed by the released binary and look like the build never took effect.
  INSTALL_DIR: '{{.HOME}}/.local/bin'

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  cli:build:
    desc: Build the icb CLI to bin/icb
    dir: cli
    cmds:
      - go build -ldflags "-s -w -X github.com/datapointchris/ichrisbirch/cli/internal/cli.version={{.VERSION}}" -o ../bin/icb .

  cli:install:
    desc: Install the icb CLI to ~/.local/bin (over the released binary)
    dir: cli
    cmds:
      - go build -ldflags "-s -w -X github.com/datapointchris/ichrisbirch/cli/internal/cli.version={{.VERSION}}" -o {{.INSTALL_DIR}}/icb .
      - 'echo "installed icb {{.VERSION}} -> {{.INSTALL_DIR}}/icb"'

  cli:test:
    desc: Run the CLI test suite
    # -race is not optional: `overview` fetches its sections concurrently off one
    # shared token source, so a regression there is only visible to the detector.
    dir: cli
    cmds:
      - go test -race ./...

  cli:lint:
    desc: Vet the CLI and fail on unformatted files
    dir: cli
    cmds:
      - go vet ./...
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:"; echo "$unformatted"; exit 1
        fi

  cli:fmt:
    desc: Format the CLI sources
    dir: cli
    cmds:
      - gofmt -w .
