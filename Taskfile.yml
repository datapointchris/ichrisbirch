version: '3'

# The jobs every repo shares (test, lint, format, build, install) run each
# component under its prefix: python: for the app, cli: for the Go CLI and web:
# for the Vue frontend. Dev and test containers, docker, routing, ssl, db and
# logs belong to ops/icbops and are not duplicated here.

vars:
  # Match only the CLI's own tags and strip the prefix, so a local build reports
  # the same shape as a release (v0.2.0-3-gabc1234) instead of the app's tags.
  VERSION:
    sh: git describe --tags --match 'cli/v*' --always --dirty 2>/dev/null | sed 's|^cli/||' || echo dev
  # ~/.local/bin, not $GOBIN: that is where the released binary installs, and
  # it precedes ~/go/bin on PATH — a $GOBIN install would sit there
  # shadowed by the released binary and look like the build never took effect.
  INSTALL_DIR: '{{.HOME}}/.local/bin'

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Make a fresh checkout runnable — dependencies, then the files git cannot carry
    cmds:
      - uv sync
      - npm ci --prefix frontend
      - task: setup-local

  # A worktree is a clean checkout, so everything gitignored is absent. Two
  # things have no manifest to rebuild them from: .env is hand-written, and the
  # traefik dev certs have no generator anywhere in the repo. Copying from the
  # primary is the only source.
  #
  # PRIMARY is derived rather than configured. Every worktree shares the primary's
  # git directory, so --git-common-dir names it from anywhere, and running this in
  # the primary itself resolves to the same tree and no-ops.
  #
  # The copied .env carries fixed ports (8000, 5432, 6379). Two worktrees
  # running servers at once collide on all of them — edit the copy when that
  # happens rather than assuming this handles it.
  setup-local:
    desc: Copy in what git cannot carry, from the primary checkout
    internal: true
    vars:
      PRIMARY:
        sh: git rev-parse --path-format=absolute --git-common-dir | sed 's|/\.git$||'
    status:
      - test "$(pwd)" = "{{.PRIMARY}}"
    cmds:
      - cp -n {{.PRIMARY}}/.env .env
      - mkdir -p deploy-containers/traefik/certs
      - cp -n {{.PRIMARY}}/deploy-containers/traefik/certs/*.crt {{.PRIMARY}}/deploy-containers/traefik/certs/*.key deploy-containers/traefik/certs/

  test:
    desc: Run every suite but e2e — Python, the CLI and the frontend
    cmds:
      - task: python:test
      - task: cli:test
      - task: web:test

  lint:
    desc: Run every read-only check, format checks and type checks included
    cmds:
      - task: python:lint
      - task: cli:lint
      - task: web:lint

  format:
    desc: Format every component and apply its linter's autofixes
    cmds:
      - task: python:format
      - task: cli:format
      - task: web:format

  build:
    desc: Build the CLI to bin/icb and the frontend to frontend/dist
    cmds:
      - task: cli:build
      - task: web:build

  install:
    desc: Install the icb CLI to ~/.local/bin (over the released binary)
    cmds:
      - task: cli:install

  # The same entry point the pytest hook calls, so its reports land in
  # .test-reports/ as they do on a commit.
  python:test:
    desc: Run the Python suite against its own throwaway Postgres and Redis
    cmds:
      - ./ops/icbops test run

  # mypy runs with the arguments the mypy hook passes.
  python:lint:
    desc: Run ruff's lint and format check, then mypy, writing no file
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run --all-extras mypy . --install-types --non-interactive

  python:format:
    desc: Format Python and apply ruff's autofixes
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  web:test:
    desc: Run the frontend's TypeScript build check and unit tests
    dir: frontend
    cmds:
      - npm test

  web:lint:
    desc: Run eslint, the prettier check and vue-tsc on the frontend, writing no file
    dir: frontend
    cmds:
      - npm run lint
      - npx prettier --check .
      - npm run typecheck

  web:format:
    desc: Format the frontend and apply eslint's autofixes
    dir: frontend
    cmds:
      - npx prettier --write .
      - npm run lint:fix

  web:build:
    desc: Build the frontend to frontend/dist
    dir: frontend
    cmds:
      - npm run build

  cli:build:
    desc: Build the icb CLI to bin/icb
    dir: cli
    cmds:
      - go build -ldflags "-s -w -X github.com/datapointchris/ichrisbirch/cli/internal/cli.version={{.VERSION}}" -o ../bin/icb .

  cli:install:
    desc: Install the icb CLI to ~/.local/bin (over the released binary)
    dir: cli
    cmds:
      - go build -ldflags "-s -w -X github.com/datapointchris/ichrisbirch/cli/internal/cli.version={{.VERSION}}" -o {{.INSTALL_DIR}}/icb .
      - 'echo "installed icb {{.VERSION}} -> {{.INSTALL_DIR}}/icb"'

  cli:test:
    desc: Run the CLI test suite
    # -race is not optional: `overview` fetches its sections concurrently off one
    # shared token source, so a regression there is only visible to the detector.
    dir: cli
    cmds:
      - go test -race ./...

  cli:lint:
    desc: Vet the CLI and fail on unformatted files
    dir: cli
    cmds:
      - go vet ./...
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:"; echo "$unformatted"; exit 1
        fi

  cli:format:
    desc: Format the CLI sources
    dir: cli
    cmds:
      - gofmt -w .
