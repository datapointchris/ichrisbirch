# CI-specific overrides for GitHub Actions. `icbops` adds this file to the
# test stack's compose set when CI=true.

services:
  # CI drops the docker.sock bind-mount that test.yml's api uses for the
  # docker_prune scheduled job. `!override` replaces the whole list, so this
  # one repeats `.:/app` and the anonymous `/app/.venv`. Never make the venv
  # or the uv cache a named volume here. A named one keeps a stale venv across
  # rebuilds, and the api then sits in "health: starting" while uv resyncs.
  api:
    volumes: !override
      - .:/app
      - /app/.venv
